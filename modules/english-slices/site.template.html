<!doctype html><html lang="zh-CN" data-workhub-theme="codex-light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>英语成片学习</title><style>__DESIGN_CSS__</style><style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;color:var(--wh-ink);background:var(--wh-bg);font:14px/1.7 var(--wh-font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;min-height:34px;max-width:100%;border:1px solid var(--wh-border);border-radius:7px;background:var(--wh-surface);padding:5px 9px}
button,summary{cursor:pointer}button:hover{background:var(--wh-accent-soft)}button:disabled{cursor:default;opacity:.42}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--wh-focus);outline-offset:2px}
main{max-width:1600px;margin:auto;padding:14px 20px 28px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:11px;border-bottom:1px solid var(--wh-border)}
.tabs{display:flex;gap:16px;align-items:center;flex-shrink:0}.tabs button{position:relative;background:transparent;border:0;border-radius:0;padding:6px 1px;white-space:nowrap;font-size:14px;color:var(--wh-muted)}
.tabs button[aria-pressed=true]{color:var(--wh-ink);font-weight:600}.tabs button[aria-pressed=true]::after{position:absolute;content:"";height:2px;bottom:-12px;left:0;right:0;background:currentColor;border-radius:2px}
.toolbar input{flex:1 1 230px;min-width:160px;margin-left:7px;background:var(--wh-accent-soft);border-color:transparent}
.toolbar input:focus{background:var(--wh-surface);border-color:var(--wh-border-strong)}
#scene{flex:0 1 165px;max-width:175px;font-size:13px;background:transparent;border-color:transparent}
#settings-toggle{font-size:13px;background:transparent;border-color:transparent;color:var(--wh-muted);padding-left:8px;padding-right:8px}
#settings-toggle[aria-expanded=true]{background:var(--wh-accent-soft);color:var(--wh-ink)}
.settings-panel{display:grid;grid-template-columns:minmax(180px,2fr) repeat(4,minmax(100px,1fr));gap:12px 16px;padding:13px 14px 15px;border:1px solid var(--wh-border);border-top:0;border-radius:0 0 10px 10px;background:var(--wh-surface);box-shadow:0 8px 24px rgb(20 20 30 / .035)}
.settings-panel label{display:flex;gap:5px;min-width:0;flex-direction:column}.settings-panel label>span{font-size:12px;color:var(--wh-muted)}.settings-panel select{min-width:0;width:100%;font-size:13px}
.subbar{display:flex;align-items:center;flex-wrap:wrap;gap:7px 12px;padding:11px 0 5px;font-size:12px;color:var(--wh-muted)}.subbar .spacer{flex:1}.subbar button{font-size:12px;min-height:29px;padding:3px 6px;background:transparent;border-color:transparent;white-space:nowrap}
.subbar button:hover{background:var(--wh-accent-soft)}.status{font-size:12px;line-height:1.7;color:var(--wh-muted)}.status.error{color:var(--wh-ink);font-weight:500}
#count{white-space:nowrap;font-variant-numeric:tabular-nums}.help-notes{margin:0 0 13px;color:var(--wh-muted)}.help-notes>summary{width:fit-content;max-width:100%;font-size:12px;padding:2px 0}.help-content{max-width:900px;padding:7px 0 2px;font-size:12px;line-height:1.9}.help-content p,.help-content footer{margin:6px 0}.notice{font-size:13px;border:1px solid var(--wh-border-strong);border-left:3px solid var(--wh-warning,var(--wh-ink));border-radius:7px;background:var(--wh-accent-soft);padding:10px 12px;margin:8px 0 13px}
.slice{margin:0 0 16px;border:1px solid var(--wh-border);border-radius:10px;background:var(--wh-surface);box-shadow:0 10px 32px rgb(20 20 30 / .045);overflow:hidden;scroll-margin-top:12px}
.slice-head{display:flex;align-items:center;gap:9px;padding:11px 17px;border-bottom:1px solid var(--wh-border)}.slice-head h2{font-size:14px;font-weight:600;line-height:1.7;margin:0}.slice-head>span{font-size:12px;color:var(--wh-muted)}.slice-head>button{margin-left:auto;font-size:12px;min-height:28px;border-color:transparent;padding:2px 7px;background:transparent;color:var(--wh-muted)}.slice-head>button:hover{background:var(--wh-accent-soft);color:var(--wh-ink)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;padding:0 4px;margin-bottom:-1px}
.card{min-width:0;padding:15px 14px 13px;background:transparent;border:0;border-bottom:1px solid var(--wh-border);border-radius:0;overflow-wrap:anywhere}
.card.seen{background:var(--wh-accent-soft)}.word{display:block;max-width:100%;min-height:31px;padding:0;text-align:left;font-size:22px;font-weight:600;line-height:1.4;letter-spacing:-.35px;background:transparent;border:0;border-radius:0;overflow-wrap:anywhere}
.word:hover,.example:hover{background:transparent;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}.meaning{font-size:14px;line-height:1.7;margin:4px 0 12px}
.example{display:block;text-align:left;padding:0;min-height:0;font-size:14px;line-height:1.7;background:transparent;border:0;border-radius:0}
.translation{font-size:13px;line-height:1.7;color:var(--wh-muted);margin:5px 0 0}.card-meta{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;margin-top:12px;font-size:11px;line-height:1.65;color:var(--wh-muted)}
.scene-label{overflow-wrap:anywhere}.seen-label{display:flex;align-items:center;gap:4px;white-space:nowrap}.seen-label input{min-height:0;padding:0;margin:0;accent-color:var(--wh-accent)}
.phrase .example{font-size:16px;line-height:1.7;font-weight:500}.phrase .meaning{display:none}.empty{padding:34px 16px;text-align:center;color:var(--wh-muted);font-size:13px;border-top:1px solid var(--wh-border)}
dialog{width:calc(100% - 28px);max-width:560px;padding:22px;border:1px solid var(--wh-border);border-radius:10px;background:var(--wh-surface);color:var(--wh-ink);box-shadow:0 28px 80px rgb(0 0 0 / .2)}dialog::backdrop{background:rgb(0 0 0 / .34)}dialog h2{font-size:18px;margin:0 0 9px}dialog p{font-size:13px;line-height:1.8;color:var(--wh-muted)}dialog input{width:100%;max-width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@supports(background:color-mix(in srgb,white,black)){.slice{background:color-mix(in srgb,var(--wh-surface) 94%,var(--wh-bg))}.settings-panel{background:color-mix(in srgb,var(--wh-surface) 92%,transparent)}.card.seen{background:color-mix(in srgb,var(--wh-accent-soft) 60%,transparent)}}
@supports(backdrop-filter:blur(12px)){.settings-panel{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}}
@media(max-width:1050px){.settings-panel{grid-template-columns:minmax(180px,2fr) repeat(2,minmax(100px,1fr))}.settings-panel label:first-child{grid-row:span 2}}
@media(max-width:800px){main{padding:12px 14px 24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{gap:8px}.toolbar input{min-width:140px;flex-basis:170px}.card{padding:14px 12px}.card-meta{flex-wrap:wrap}.settings-panel{grid-template-columns:repeat(2,minmax(0,1fr))}.settings-panel label:first-child{grid-column:1/-1;grid-row:auto}}
@media(max-width:520px){main{padding:10px 10px 20px}.toolbar{gap:7px 10px;padding-bottom:10px}.tabs{order:0;flex:1;gap:18px}.tabs button[aria-pressed=true]::after{bottom:-4px}#settings-toggle{order:1}.toolbar input{order:2;margin-left:0;min-width:0;flex:1 1 160px}#scene{order:2;flex:0 1 126px;max-width:126px}.subbar{gap:5px 9px;padding-top:9px}.subbar .spacer{flex-basis:100%;height:0}.subbar .status{flex:1;min-width:0}.subbar button{padding:2px 4px}.help-notes{margin-bottom:10px}.slice{margin-bottom:13px;box-shadow:0 7px 22px rgb(20 20 30 / .035)}.slice-head{padding:10px 12px}.grid{padding:0 1px}.card{padding:13px 10px 12px}.word{font-size:21px}.meaning{font-size:14px;margin-bottom:10px}.card-meta{font-size:11px;gap:5px}.phrase-grid{grid-template-columns:1fr}.settings-panel{gap:10px;padding:12px}.settings-panel select{min-height:36px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body data-workhub-native><main>
<div class="toolbar"><nav class="tabs" aria-label="学习视图"><button id="words-tab" type="button">词片</button><button id="phrases-tab" type="button">生活句子</button></nav><label class="sr" for="search">搜索单词、句子或中文</label><input id="search" type="search" aria-label="搜索单词、句子或中文" autocomplete="off"><select id="scene" aria-label="场景"></select><button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">设置</button></div>
<section id="settings-panel" class="settings-panel" aria-label="学习设置" hidden><label><span id="voice-label">英语声音</span><select id="voice" aria-label="英语声音"></select></label><label><span id="rate-label">语速</span><select id="rate" aria-label="语速"><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1">1×</option><option value="1.15">1.15×</option></select></label><label><span id="batch-label">每片数量</span><select id="batch" aria-label="每片数量"><option value="8">8</option><option value="16">16</option><option value="32">32</option></select></label><label><span id="language-label">界面语言</span><select id="language" aria-label="界面语言"><option value="zh-CN">中文</option><option value="en">English</option></select></label><label><span id="theme-label">配色</span><select id="theme" aria-label="配色"></select></label></section>
<div class="subbar"><span id="count" aria-live="polite"></span><span id="speech-status" class="status" role="status" aria-live="polite"></span><span class="spacer"></span><button id="pause" type="button" disabled></button><button id="stop" type="button" disabled></button><button id="import-open" type="button"></button><button id="export" type="button"></button></div>
<details id="learning-notes" class="help-notes"><summary id="notes-toggle">保存与播放说明</summary><div class="help-content"><p id="storage-note"></p><p id="voice-note"></p><footer id="footer"></footer></div></details>
<div id="storage-alert" class="notice" role="alert" hidden></div><div id="board"></div>
<dialog id="import-dialog" aria-labelledby="import-title"><h2 id="import-title"></h2><p id="import-help"></p><input id="import-file" type="file" accept=".csv,.tsv,.json,.txt,text/plain,text/csv,application/json"><p id="import-result" role="status"></p><div class="dialog-actions"><button id="import-close" type="button"></button><button id="import-run" type="button"></button></div></dialog>
</main><script id="starter-data" type="application/json">__STARTER_JSON__</script><script>__THEME_JS__</script><script>__APP_JS__</script></body></html>
