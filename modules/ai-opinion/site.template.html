;font-size:23px;font-weight:600;line-height:1.3}.stat span{font-size:12px;color:var(--wh-muted)}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.tabs button{min-height:32px;padding:4px 10px;font-size:13px}.section{margin-bottom:10px;border:1px solid var(--wh-border);border-radius:9px;background:var(--wh-surface);overflow:hidden}.section h2{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;font-size:14px;border-bottom:1px solid var(--wh-border)}.section h2 span:last-child{font-size:12px;color:var(--wh-muted);font-weight:400}.item{display:grid;grid-template-columns:8px minmax(0,1fr);gap:9px;padding:10px 12px;border-bottom:1px solid var(--wh-border)}.item:last-child{border-bottom:0}.dot{width:7px;height:7px;margin-top:8px;border-radius:100%;background:var(--wh-muted)}.dot.high{background:#b64739}.dot.medium{background:#ac761e}.dot.positive{background:#438154}.item-title{font-size:14px;line-height:1.65}.item .meta{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:3px}.terms{color:var(--wh-warning)}.change-flag{display:inline-block;margin-left:7px;padding:0 6px;border:1px solid var(--wh-border);border-radius:4px;background:var(--wh-accent-soft);color:var(--wh-accent);font-size:11px;line-height:1.8;vertical-align:middle}.change-flag.changed{color:var(--wh-warning)}.delta-note{font-size:12px}.empty{padding:22px 14px;color:var(--wh-muted);font-size:13px}.panel{padding:12px;background:var(--wh-surface);border:1px solid var(--wh-border);border-radius:9px}.panel h2{font-size:14px;margin-bottom:4px}.source{padding:9px 0;border-bottom:1px solid var(--wh-border)}.source:last-child{border-bottom:0}.source-head{display:flex;gap:8px;align-items:start;justify-content:space-between;font-size:12px}.source-name{overflow-wrap:anywhere}.pill{flex:none;padding:0 6px;border-radius:4px;background:var(--wh-accent-soft);color:var(--wh-accent);font-size:11px;line-height:1.8}.pill.error{color:#943c2e;background:#ffede7}.pill.empty{padding:0 6px;color:# @media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}aside{order:2}.health-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.app{padding:10px 12px 20px}header{padding:10px 12px}.stats{gap:6px}.stat{padding:8px 10px}.stat b{font-size:21px}}

<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('report-data').textContent);
  const $ = id => document.getElementById(id);
  const messages = {
    'zh-CN': {title:'AI 产品舆情',language:'界面语言',theme:'配色',date:'日期',search:'搜索标题、来源或关键词',all:'全部',alerts:'负面线索',domestic:'国内 AI',international:'国际 AI',hardware:'AI 硬件',voices:'人物言论',hot:'AI 热搜',high:'高关注线索',medium:'争议与风险',positive:'利好与发布',neutral:'普通信息',health:'最近一次采集',sourceDetails:'来源明细',emptyMeaning:'无匹配：请求和解析成功，但没有符合时间窗、去重或筛选规则的新条目。',scope:'颜色只表示标题关键词线索，不能证明事件属实。请核对原文、官方公告与发布时间；采集不完整时不能据此判断“没有负面”。',demo:'虚构演示 · 全部标题、来源与状态均为示例，未联网采集。',complete:'本轮来源请求完成；结果仍需核对原始报道。',partial:'本轮采集不完整，部分来源失败；当前条目不能代表完整舆情。',unavailable:'本轮采集不可用，无法据此判断是否存在负面信息。',retained:'本轮全部来源失败；页面保留上一次可用数据，请留意采集时间。',stale:'最近可用数据已超过 36 小时，尚未确认有更新。',noRun:'尚无采集状态。请先采集，再构建页面。',noData:'暂无可用日报。运行采集器后重新构建页面；离线体验请显式使用 --demo。',noMatch:'没有符合当前筛选的条目。',noAlerts:'本轮未命中预设负面关键词，仍需人工复核。',uncertainAlerts:'当前未显示负面线索；由于资料不完整，不能判断“没有负面”。',noItems:'该分区暂无条目。',noItemsOverall:'暂无可显示条目，不能据此判断没有负面信息；请检查来源状态。',entries:'条',unique:'条去重线索',ok:'成功',empty:'无匹配',error:'失败',view:'显示',changes:'新增 / 变化',full:'全量资料',changesCount:'新增或变化',new:'新增',changed:'有变化',deltaFirst:'当前窗口没有可比较的成功基线，先展示全量；不把它们标作新增。',deltaExpired:'上次可用基线已超出 14 日窗口，本次未用于比较，当前显示全量。',deltaFuture:'旧基线的时间晚于本次采集，本次未用于比较，当前显示全量。',deltaMissing:'这份日报没有可验证的同轮增量记录，当前显示全量。',deltaSkipped:'最近采集未完成比较，保留的旧数据不作为本轮新增；当前显示全量。',deltaSelected:'所选快照比较',baseline:'基线',recentScope:'按近 14 日有容量上限的已见记录比较；不是语义事件识别，未收录不代表事件消失。',resetScope:'已见索引已重建，本次仅与上一可用快照比较；可能重新显示更早见过的资料，不代表事件消失后重现。',noChanges:'本分区没有新增或变化；可切换全量资料。',noChangesOverall:'与当前基线相比，没有新增或变化；可切换全量资料。',deltaCounts:'新增 / 变化 / 未变',source:'来源',allSources:'全部来源',allRisks:'全部级别',reports:'可查日报',negativeCount:'负面关键词线索',sources:'最近来源',generated:'所选日报采集',built:'页面构建',unknown:'时间未知',observed:'观察时间',published:'发布时间',keywords:'命中词',historical:'历史日报',diagnostics:'有输入文件无法读取，部分资料未显示。',direct:'直连',proxy:'代理',accepted:'收录',fetched:'获取','codex-light':'Codex 明亮','codex-dark':'Codex 深色',moss:'苔绿',fog:'雾蓝',graphite:'石墨',sand:'暖沙',orange:'橙白',teal:'青瓷',rose:'玫瑰',indigo:'靛蓝'},
    en: {title:'AI product opinion radar',language:'Language',theme:'Colors',date:'Date',search:'Search headlines, sources or keywords',all:'All',alerts:'Negative signals',domestic:'Domestic AI',international:'International AI',hardware:'AI hardware',voices:'People & statements',hot:'AI trends',high:'High-attention signals',medium:'Risk or controversy',positive:'Positive or launches',neutral:'General',health:'Latest collection run',sourceDetails:'Source details',emptyMeaning:'No match means the request and parsing succeeded, but no new item passed the date window, deduplication or filters.',scope:'Colors flag headline keywords; they do not establish facts. Check original reports, official notices and dates. Incomplete collection cannot establish that there is no negative news.',demo:'Fictional demo · Headlines, sources and statuses are examples. No network collection was performed.',complete:'Source requests completed. Verify the original reports before drawing conclusions.',partial:'Collection is incomplete: some sources failed. These items do not represent full coverage.',unavailable:'Collection is unavailable. No conclusion about the absence of negative news is supported.',retained:'Every source failed in the latest run. The last available data is retained; check its collection time.',stale:'The latest available data is over 36 hours old; no newer data has been confirmed.',noRun:'No collection status yet. Collect first, then rebuild.',noData:'No reports available. Run the collector and rebuild; use --demo explicitly for an offline example.',noMatch:'No items match the current filters.',noAlerts:'No preset negative keywords matched this run. Manual review is still needed.',uncertainAlerts:'No negative signals are shown, but incomplete evidence cannot establish their absence.',noItems:'No items in this section.',noItemsOverall:'No items are available to display. This does not establish an absence of negative news; check source health.',entries:'items',entriesSingular:'item',unique:'unique signals',uniqueSingular:'unique signal',ok:'Success',empty:'No match',error:'Failed',view:'View',changes:'New / changed',full:'All material',changesCount:'New or changed',new:'New',changed:'Changed',deltaFirst:'No comparable successful baseline is available in the current window. All material is shown without marking it as new.',deltaExpired:'The previous usable baseline is outside the 14-day window and was not compared. All material is shown.',deltaFuture:'The old baseline is dated after this attempt and was not compared. All material is shown.',deltaMissing:'This report has no verifiable delta for its own snapshot. All material is shown.',deltaSkipped:'The latest attempt did not complete comparison. Retained data is not new in that attempt; all material is shown.',deltaSelected:'Selected snapshot comparison',baseline:'Baseline',recentScope:'Compared with a capacity-bounded 14-day seen index, not semantic event detection. An omitted item does not mean an event disappeared.',resetScope:'The seen index was rebuilt. Comparison uses only the previous usable snapshot and may surface older material again; this does not establish an event disappeared and returned.',noChanges:'No new or changed items in this section. Switch to all material to read older items.',noChangesOverall:'No new or changed items compared with this baseline. Switch to all material to read older items.',deltaCounts:'New / changed / unchanged',source:'Source',allSources:'All sources',allRisks:'All levels',reports:'Available days',negativeCount:'Negative keyword signals',negativeCountSingular:'Negative keyword signal',sources:'Latest sources',sourcesSingular:'Latest source',generated:'Selected report collected',built:'Page built',unknown:'Unknown time',observed:'Observed',published:'Published',keywords:'Matched',historical:'Historical report',diagnostics:'Some input files could not be read; available material may be incomplete.',direct:'Direct',proxy:'Proxy',accepted:'Accepted',fetched:'Fetched','codex-light':'Codex Light','codex-dark':'Codex Dark',moss:'Moss',fog:'Mist blue',graphite:'Graphite',sand:'Warm sand',orange:'Orange',teal:'Celadon',rose:'Rose',indigo:'Indigo'}
  };
  const languageKey='workhub-language'; let language='zh-CN';
  try { const saved=localStorage.getItem(languageKey); if (saved==='en'||saved==='zh-CN') language=saved; } catch {}
  const state={date:DATA.days[0]?.report_date||'',section:'all',risk:'all',source:'all',query:'',view:'changes'};
  const t=key=>messages[language][key]||key;
  const countLabel=(count,key)=>language==='en'&&count===1?(messages.en[key+'Singular']||t(key)):t(key);
  const activeTheme=()=>document.documentElement.getAttribute('data-workhub-theme')||window.WorkhubEmbeddedTheme.getTheme();
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
  const safeLink=value=>{try{const u=new URL(value);return /^https?:$/.test(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}};
  const time=value=>{if(!value)return t('unknown');const date=new Date(value);return Number.isNaN(date.getTime())?t('unknown'):date.toLocaleString(language==='en'?'en-GB':'zh-CN',{dateStyle:'medium',timeStyle:'short'});};
  function options(node,values,selected){node.replaceChildren(...values.map(([value,label])=>{const n=el('option','',label);n.value=value;n.selected=value===selected;return n;}));}
  function current(){return DATA.days.find(day=>day.report_date===state.date)||null;}
  function sourcesOfRun(){return (DATA.last_run||DATA.days[0])?.sources||[];}
  function deltaStatus(day){
    const delta=day?.delta,run=DATA.last_run,latest=DATA.days[0];
    // A failed attempt never makes the retained latest snapshot newly current.
    const failedLatest=day&&latest&&day.run_id===latest.run_id&&run?.coverage?.state==='unavailable'&&run.run_id!==day.run_id;
    if(failedLatest)return {active:false,reason:'deltaSkipped'};
    if(!delta?.valid||delta.run_id!==day?.run_id)return {active:false,reason:'deltaMissing'};
    if(delta.comparison_skipped)return {active:false,reason:'deltaSkipped'};
    if(!delta.has_baseline)return {active:false,reason:delta.baseline_reason==='expired'?'deltaExpired':delta.baseline_reason==='future'?'deltaFuture':'deltaFirst'};
    return {active:true,delta};
  }
  function renderDelta(day){
    const status=deltaStatus(day),note=$('delta-note');
    if(!day){note.hidden=true;return status;}
    note.hidden=false;
    if(!status.active){const old=day.delta?.unusable_baseline_generated_at;note.textContent=t(status.reason)+(old?` ${t('baseline')}: ${time(old)}`:'');return status;}
    const d=status.delta,c=d.counts;
    note.textContent=`${t('deltaSelected')}: ${time(day.generated_at)} · ${t('baseline')}: ${time(d.baseline_generated_at)} · ${t('deltaCounts')}: ${c.new} / ${c.changed} / ${c.unchanged}${language==='en'?'.':'。'} ${t(d.comparison_scope==='previous_snapshot_after_index_reset'?'resetScope':'recentScope')}`;
    return status;
  }
  function renderHealth(){
    const run=DATA.last_run||DATA.days[0],sources=sourcesOfRun();
    $('run-time').textContent=run?time(run.generated_at):t('noRun');
    const counts={ok:0,empty:0,error:0};sources.forEach(s=>counts[s.state]=(counts[s.state]||0)+1);
    $('health-summary').textContent=['ok','empty','error'].map(k=>`${t(k)} ${counts[k]}`).join(' · ');
    $('source-list').replaceChildren(...sources.map(s=>{const n=el('div','source'),head=el('div','source-head');head.append(el('span','source-name',s.name||s.id),el('span',`pill ${s.state}`,t(s.state)));n.append(head,el('p','meta',`${t('fetched')} ${s.fetched_count} · ${t('accepted')} ${s.accepted_count}${s.route?' · '+t(s.route):''}${s.http_status?' · HTTP '+s.http_status:''}`));if(s.error_code||s.empty_reason)n.append(el('p','meta',s.error_code||s.empty_reason));return n;}));
    const latest=DATA.days[0],age=latest?(Date.now()-Date.parse(latest.generated_at))/3600000:0;
    let key=run?.coverage?.state||'noRun';if(run?.reused_latest&&latest)key='retained';
    const notes=[t(key)];if(latest&&Number.isFinite(age)&&age>36)notes.push(t('stale'));if(DATA.diagnostics.length)notes.push(t('diagnostics'));
    $('coverage-note').textContent=notes.join(' ');$('coverage-note').className='notice'+(['unavailable','retained'].includes(key)?' error':key==='partial'||age>36?' warn':'');
  }
  function renderStats(day){const items=day?.items||[],negative=items.filter(i=>['high','medium'].includes(i.risk)).length,status=deltaStatus(day);const changed=status.active?status.delta.counts.new+status.delta.counts.changed:'—';const values=[[items.length,'unique'],[negative,'negativeCount'],[changed,'changesCount'],[sourcesOfRun().length,'sources']];$('stats').replaceChildren(...values.map(([v,key])=>{const n=el('div','stat');n.append(el('b','',String(v)),el('span','',countLabel(v,key)));return n;}));}

  function itemNode(item,status){const row=el('article','item');row.append(el('span','dot '+item.risk));const content=el('div'),link=safeLink(item.url),title=el(link?'a':'p','item-title',item.title);if(link){title.href=link;title.target='_blank';title.rel='noopener noreferrer';}content.append(title);if(status.active){const change=status.delta.new_ids.includes(item.id)?'new':status.delta.changed_ids.includes(item.id)?'changed':'';if(change)content.append(el('span','change-flag '+change,t(change)));}const meta=el('div','meta');meta.append(el('span','',item.source||t('source')),el('span','',t(item.risk)));const stamp=item.published_at||item.observed_at;meta.append(el('span','',`${t(item.published_at?'published':'observed')}: ${time(stamp)}`));if(item.risk_terms.length)meta.append(el('span','terms',`${t('keywords')}: ${item.risk_terms.join(' · ')}`));content.append(meta);row.append(content);return row;}
  function renderBoard(){
    const day=current(),items=day?.items||[],status=renderDelta(day);renderStats(day);
    const candidates=state.view==='changes'&&status.active?items.filter(i=>status.delta.new_ids.includes(i.id)||status.delta.changed_ids.includes(i.id)):items;
    const filtered=candidates.filter(i=>(state.risk==='all'||i.risk===state.risk)&&(state.source==='all'||i.source===state.source)&&(!state.query||[i.title,i.source,...i.risk_terms].join(' ').toLocaleLowerCase().includes(state.query)));
    const negative=i=>['high','medium'].includes(i.risk);
    const groups=['alerts','domestic','international','hardware','voices','hot'];
    const visible=state.section==='all'?filtered:filtered.filter(i=>state.section==='alerts'?negative(i):i.section===state.section);
    $('result-count').textContent=`${visible.length} ${countLabel(visible.length,'unique')}`;
    const board=$('board');board.replaceChildren();
    if(!day){board.append(el('div','section empty',t('noData')));return;}
    if(!visible.length){
      const filteredOut=state.query||state.risk!=='all'||state.source!=='all';
      const incomplete=day.coverage.state!=='complete'||DATA.last_run?.coverage?.state==='unavailable';
      const key=filteredOut?'noMatch':state.view==='changes'&&status.active?(state.section==='all'?'noChangesOverall':'noChanges'):state.section==='alerts'?(incomplete?'uncertainAlerts':'noAlerts'):state.section==='all'?'noItemsOverall':'noItems';
      const text=state.section==='all'?t(key):`${t(state.section)}: ${t(key)}`;
      board.append(el('div','section empty',text));return;
    }
    const renderGroups=state.section==='all'?groups:[state.section];
    renderGroups.forEach(key=>{const pool=filtered.filter(i=>key==='alerts'?negative(i):i.section===key);if(state.section==='all'&&key!=='alerts'&&!pool.length)return;const section=el('section','section'),heading=el('h2');heading.append(el('span','',t(key)),el('span','',`${pool.length} ${countLabel(pool.length,'entries')}`));section.append(heading);if(pool.length){pool.sort((a,b)=>({high:0,medium:1,neutral:2,positive:3}[a.risk]-{high:0,medium:1,neutral:2,positive:3}[b.risk]));pool.forEach(i=>section.append(itemNode(i,status)));}else{const incomplete=day.coverage.state!=='complete'||DATA.last_run?.coverage?.state==='unavailable';section.append(el('p','empty',state.query||state.risk!=='all'||state.source!=='all'?t('noMatch'):state.view==='changes'&&status.active?t('noChanges'):key==='alerts'?t(incomplete?'uncertainAlerts':'noAlerts'):t('noItems')));}board.append(section);});
  }
  function renderChrome(){
    document.documentElement.lang=language;document.title=t('title');document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));
    const delta=deltaStatus(current());if(!delta.active&&state.view==='changes')state.view='all';
    options($('view'),[['changes',t('changes')],['all',t('full')]],state.view);$('view').children[0].disabled=!delta.active;$('view').setAttribute('aria-label',t('view'));
    $('language').value=language;$('language').setAttribute('aria-label',t('language'));$('theme').setAttribute('aria-label',t('theme'));$('date').setAttribute('aria-label',t('date'));$('search').placeholder=t('search');$('risk').setAttribute('aria-label',t('allRisks'));$('source').setAttribute('aria-label',t('source'));$('tabs').setAttribute('aria-label',t('all'));
    options($('date'),DATA.days.length?DATA.days.map(d=>[d.report_date,d.report_date+(d.report_date!==DATA.calendar_date?' · '+t('historical'):'')]):[['',t('noData')]],state.date);
    options($('risk'),[['all',t('allRisks')],...['high','medium','positive','neutral'].map(k=>[k,t(k)])],state.risk);
    const sourceNames=[...new Set((current()?.items||[]).map(i=>i.source))].sort();if(state.source!=='all'&&!sourceNames.includes(state.source))state.source='all';options($('source'),[['all',t('allSources')],...sourceNames.map(s=>[s,s])],state.source);
    options($('theme'),window.WorkhubEmbeddedTheme.themes.map(k=>[k,t(k)]),activeTheme());
    $('tabs').replaceChildren(...['all','alerts','domestic','international','hardware','voices','hot'].map(key=>{const b=el('button','',t(key));b.type='button';b.setAttribute('aria-pressed',String(state.section===key));b.addEventListener('click',()=>{state.section=key;renderChrome();renderBoard();});return b;}));
    const day=current();$('generated').textContent=`${t('generated')}: ${time(day?.generated_at)}`;$('build-note').textContent=`${t('built')}: ${time(DATA.generated_at)}`;
    $('demo-note').hidden=!(DATA.is_demo||day?.is_demo||DATA.last_run?.is_demo);$('demo-note').textContent=t('demo');renderHealth();
  }
  function applyLanguage(value,persist=true){if(!['zh-CN','en'].includes(value))return;language=value;if(persist){try{localStorage.setItem(languageKey,value);}catch{}}renderChrome();renderBoard();}
  const allowedParents=new Set(['http://127.0.0.1:8787']);const configured=document.documentElement.getAttribute('data-workhub-parent-origin');
  if(configured){try{const u=new URL(configured);if(['http:','https:'].includes(u.protocol)&&['127.0.0.1','localhost','[::1]','::1'].includes(u.hostname)&&!u.username&&!u.password&&!u.search&&!u.hash&&u.pathname==='/'&&(u.origin===configured||u.origin+'/'===configured))allowedParents.add(u.origin);}catch{}}
  window.addEventListener('message',event=>{if(window.parent===window||event.source!==window.parent||!allowedParents.has(event.origin)||!event.data||typeof event.data!=='object')return;if(event.data.type==='workhub:language')applyLanguage(event.data.language);if(event.data.type==='workhub:theme')options($('theme'),window.WorkhubEmbeddedTheme.themes.map(k=>[k,t(k)]),activeTheme());});
  function requestLanguage(){if(window.parent!==window)for(const origin of allowedParents)window.parent.postMessage({type:'workhub:language-request'},origin);}
  window.addEventListener('pageshow',requestLanguage);window.addEventListener('storage',event=>{if(event.key===languageKey)applyLanguage(event.newValue||'zh-CN',false);if(event.key==='workhub-theme'||event.key===null)options($('theme'),window.WorkhubEmbeddedTheme.themes.map(k=>[k,t(k)]),activeTheme());});
  $('language').addEventListener('change',()=>applyLanguage($('language').value));
  $('theme').addEventListener('change',()=>{const fixedLight=document.documentElement.dataset.workhubReadingTheme==='light';const value=fixedLight?'codex-light':$('theme').value;if(!window.WorkhubEmbeddedTheme.themes.includes(value))return;document.documentElement.setAttribute('data-workhub-theme',value);$('theme').value=value;if(!fixedLight){try{localStorage.setItem('workhub-theme',value);}catch{}}});
  $('date').addEventListener('change',()=>{state.date=$('date').value;state.source='all';renderChrome();renderBoard();});
  $('view').addEventListener('change',()=>{state.view=$('view').value;renderBoard();});
  $('search').addEventListener('input',()=>{state.query=$('search').value.trim().toLocaleLowerCase();renderBoard();});
  $('risk').addEventListener('change',()=>{state.risk=$('risk').value;renderBoard();});$('source').addEventListener('change',()=>{state.source=$('source').value;renderBoard();});
  applyLanguage(language,false);requestLanguage();
})();
</script>
