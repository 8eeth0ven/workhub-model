rce:'来源',allSources:'全部来源',allRisks:'全部级别',reports:'可查日报',negativeCount:'负面关键词线索',sources:'最近来源',generated:'所选日报采集',built:'页面构建',unknown:'时间未知',observed:'观察时间',published:'发布时间',keywords:'命中词',historical:'历史日报',diagnostics:'有输入文件无法读取，部分资料未显示。',direct:'直连',proxy:'代理',accepted:'收录',fetched:'获取','codex-light':'Codex 明亮','codex-dark':'Codex 深色',moss:'苔绿',fog:'雾蓝',graphite:'石墨',sand:'暖沙',orange:'橙白',teal:'青瓷',rose:'玫瑰',indigo:'靛蓝'},
    en: {skipContent:'Skip to content',title:'AI product opinion radar',language:'Language',theme:'Colors',date:'Date',search:'Search headlines, sources or keywords',all:'All',alerts:'Negative signals',domestic:'Domestic AI',international:'International AI',hardware:'AI hardware',voices:'People & statements',hot:'AI trends',high:'High-attention signals',medium:'Risk or controversy',positive:'Positive or launches',neutral:'General',health:'Latest collection run',sourceDetails:'Source details',emptyMeaning:'No match means the request and parsing succeeded, but no new item passed the date window, deduplication or filters.',scope:'Colors flag headline keywords; they do not establish facts. Check original reports, official notices and dates. Incomplete collection cannot establish that there is no negative news.',demo:'Fictional demo · Headlines, sources and statuses are examples. No network collection was performed.',complete:'Source requests completed. Verify the original reports before drawing conclusions.',partial:'Collection is incomplete: some sources failed. These items do not represent full coverage.',unavailable:'Collection is unavailable. No conclusion about the absence of negative news is supported.',retained:'Every source failed in the latest run. The last available data is retained; check its collection time.',stale:'The latest available data is over 36 hours old; no newer data has been confirmed.',noRun:'No collection status yet. Collect first, then rebuild.',noData:'No reports available. Run the collector and rebuild; use --demo explicitly for an offline example.',noMatch:'No items match the current filters.',noAlerts:'No preset negative keywords matched this run. Manual review is still needed.',uncertainAlerts:'No negative signals are shown, but incomplete evidence cannot establish their absence.',noItems:'No items in this section.',noItemsOverall:'No items are available to display. This does not establish an absence of negative news; check source health.',entries:'cards',entriesSingular:'card',unique:'merged cards',uniqueSingular:'merged card',ok:'Success',empty:'No match',error:'Failed',showAll:'View all material',noChangeAuto:'No new or changed cards in the selected snapshot. Stored material is shown automatically; it is not necessarily news that happened today.',noChangeManual:'You selected changes only. No new or changed cards exist in this snapshot; view all material to read stored results.',noChangeAll:'No new or changed cards exist in this snapshot. Stored material is shown; it is not necessarily news that happened today.',allCards:'All signals',sourceOriginals:'Sources & originals',historyRecords:'Recorded history',historyUnknown:'History incomplete',historyScope:'Statistics use saved daily reports. Missing dates are unknown; recording time is not event time.',firstRecorded:'First recorded',lastRecorded:'Last recorded',observedDates:'Recorded dates',changeDates:'Title or keyword change dates',changeRecords:'Recorded title or keyword changes',noRecordedChanges:'No title or keyword change dates are present in the available record.',consecutive:'Seen for {n} consecutive days',cumulative:'Seen on {n} recorded days',view:'View',changes:'New / changed',full:'All material',changesCount:'New or changed',new:'New',changed:'Changed',deltaFirst:'No comparable successful baseline is available in the current window. All material is shown without marking it as new.',deltaExpired:'The previous usable baseline is outside the 14-day window and was not compared. All material is shown.',deltaFuture:'The old baseline is dated after this attempt and was not compared. All material is shown.',deltaMissing:'This report has no verifiable delta for its own snapshot. All material is shown.',deltaSkipped:'The latest attempt did not complete comparison. Retained data is not new in that attempt; all material is shown.',deltaSelected:'Selected snapshot comparison',baseline:'Baseline',recentScope:'Compared with a capacity-bounded 14-day seen index, not semantic event detection. An omitted item does not mean an event disappeared.',resetScope:'The seen index was rebuilt. Comparison uses only the previous usable snapshot and may surface older material again; this does not establish an event disappeared and returned.',noChanges:'No new or changed items in this section. Switch to all material to read older items.',noChangesOverall:'No new or changed items compared with this baseline. Switch to all material to read older items.',deltaCounts:'Merged cards: new / changed / unchanged',source:'Source',allSources:'All sources',allRisks:'All levels',reports:'Available days',negativeCount:'Negative keyword signals',negativeCountSingular:'Negative keyword signal',sources:'Latest sources',sourcesSingular:'Latest source',generated:'Selected report collected',built:'Page built',unknown:'Unknown time',observed:'Observed',published:'Published',keywords:'Matched',historical:'Historical report',diagnostics:'Some input files could not be read; available material may be incomplete.',direct:'Direct',proxy:'Proxy',accepted:'Accepted',fetched:'Fetched','codex-light':'Codex Light','codex-dark':'Codex Dark',moss:'Moss',fog:'Mist blue',graphite:'Graphite',sand:'Warm sand',orange:'Orange',teal:'Celadon',rose:'Rose',indigo:'Indigo'}
  };
  const languageKey='workhub-language'; let language='zh-CN';
  try { const saved=localStorage.getItem(languageKey); if (saved==='en'||saved==='zh-CN') language=saved; } catch {}
  const state={date:DATA.days[0]?.report_date||'',section:'all',risk:'all',source:'all',query:'',view:'all'};
  const viewChoices=new Map();
  const sectionKeys=['domestic','international','hardware','voices','hot'];
  const t=key=>messages[language][key]||key;
  const countLabel=(count,key)=>language==='en'&&count===1?(messages.en[key+'Singular']||t(key)):t(key);
  const activeTheme=()=>document.documentElement.getAttribute('data-workhub-theme')||window.WorkhubEmbeddedTheme.getTheme();
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
  const text=value=>typeof value==='string'?value:'';
  const safeLink=value=>{try{const u=new URL(value);return /^https?:$/.test(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}};
  const time=value=>{if(!value)return t('unknown');const date=new Date(value);return Number.isNaN(date.getTime())?t('unknown'):date.toLocaleString(language==='en'?'en-GB':'zh-CN',{dateStyle:'medium',timeStyle:'short'});};
  function options(node,values,selected){node.replaceChildren(...values.map(([value,label])=>{const n=el('option','',label);n.value=value;n.selected=value===selected;return n;}));}
  function current(){return DATA.days.find(day=>day.report_date===state.date)||null;}
  function sourcesOfRun(){return (DATA.last_run||DATA.days[0])?.sources||[];}
  function cardsOf(day){
    if(!day)return [];
    if(Array.isArray(day.groups)&&(day.groups.length||!(day.items||[]).length))return day.groups;
    return Array.isArray(day.items)?day.items:[];
  }
  function sectionsOf(card){
    const values=Array.isArray(card.sections)?card.sections:[card.section];
    return [...new Set(values.filter(value=>sectionKeys.includes(value)))];
  }
  function originalSources(card){
    const values=Array.isArray(card.sources)&&card.sources.length?card.sources:[card];
    return values.filter(value=>value&&typeof value==='object');
  }
  function sourceNamesOf(card){
    const names=Array.isArray(card.source_names)?card.source_names:[];
    return [...new Set([...names,...originalSources(card).map(value=>value.source),card.source].map(text).filter(Boolean))];
  }
  function deltaStatus(day){
    const delta=day?.delta,run=DATA.last_run,latest=DATA.days[0];
    const failedLatest=day&&latest&&day.run_id===latest.run_id&&run?.coverage?.state==='unavailable'&&run.run_id!==day.run_id;
    if(failedLatest)return {active:false,reason:'deltaSkipped'};
    if(!delta?.valid||delta.run_id!==day?.run_id)return {active:false,reason:'deltaMissing'};
    if(delta.comparison_skipped)return {active:false,reason:'deltaSkipped'};
    if(!delta.has_baseline)return {active:false,reason:delta.baseline_reason==='expired'?'deltaExpired':delta.baseline_reason==='future'?'deltaFuture':'deltaFirst'};
    return {active:true,delta};
  }
  function cardChange(card,status){
    if(!status.active)return '';
    // Group classification can deliberately suppress a newly recovered source.
    // Never promote it again by re-reading raw member IDs in the browser.
    if(Array.isArray(card.member_ids))return ['new','changed','unchanged','baseline'].includes(card.change)?card.change:'';
    return status.delta.new_ids.includes(card.id)?'new':status.delta.changed_ids.includes(card.id)?'changed':status.delta.unchanged_ids.includes(card.id)?'unchanged':'';
  }
  function changeCounts(day,status){
    const counts={new:0,changed:0,unchanged:0,baseline:0};
    cardsOf(day).forEach(card=>{const change=cardChange(card,status);if(change in counts)counts[change]++;});
    return counts;
  }
  function snapshotKey(day){return day?.run_id||day?.report_date||'';}
  function chooseDateView(){
    const day=current(),key=snapshotKey(day);
    if(viewChoices.has(key)){state.view=viewChoices.get(key);return;}
    const status=deltaStatus(day),counts=changeCounts(day,status);
    state.view=status.active&&counts.new+counts.changed>0?'changes':'all';
  }
  function selectView(value){
    if(!['all','changes'].includes(value))return;
    state.view=value;viewChoices.set(snapshotKey(current()),value);renderChrome();renderBoard();
  }
  function showAllButton(){

    button.addEventListener('click',()=>{selectView('all');$('view').focus?.();});return button;
  }
  function renderDelta(day){
    const status=deltaStatus(day),note=$('delta-note');
    if(!day){note.hidden=true;return status;}
    note.hidden=false;
    if(!status.active){const old=day.delta?.unusable_baseline_generated_at;note.textContent=t(status.reason)+(old?` ${t('baseline')}: ${time(old)}`:'');return status;}
    const d=status.delta,c=changeCounts(day,status);
    const zeroChange=c.new+c.changed===0;
    const explanation=zeroChange?t(state.view==='changes'?'noChangeManual':viewChoices.has(snapshotKey(day))?'noChangeAll':'noChangeAuto'):'';
    note.textContent=`${t('deltaSelected')}: ${time(day.generated_at)} · ${t('baseline')}: ${time(d.baseline_generated_at)} · ${t('deltaCounts')}: ${c.new} / ${c.changed} / ${c.unchanged}${language==='en'?'.':'。'} ${explanation?explanation+' ':''}${t(d.comparison_scope==='previous_snapshot_after_index_reset'?'resetScope':'recentScope')}`;
    return status;
  }
  function renderHealth(){
    const run=DATA.last_run||DATA.days[0],sources=sourcesOfRun();
    $('run-time').textContent=run?time(run.generated_at):t('noRun');
    const counts={ok:0,empty:0,error:0};sources.forEach(s=>counts[s.state]=(counts[s.state]||0)+1);
    $('health-summary').textContent=['ok','empty','error'].map(k=>`${t(k)} ${counts[k]}`).join(' · ');
    $('source-list').replaceChildren(...sources.map(s=>{const n=el('div','source'),head=el('div','source-head');head.append(el('span','source-name',s.name||s.id),el('span',`pill ${s.state}`,t(s.state)));n.append(head,el('p','meta',`${t('fetched')} ${s.fetched_count} · ${t('accepted')} ${s.accepted_count}${s.route?' · '+t(s.route):''}${s.http_status?' · HTTP '+s.http_status:''}`));if(s.error_code||s.empty_reason)n.append(el('p','meta',s.error_code||s.empty_reason));return n;}));
    const latest=DATA.days[0],age=latest?(Date.now()-Date.parse(latest.generated_at))/3600000:0;
    let key=run?.coverage?.state||'noRun';if(run?.reused_latest&&latest)key='retained';
    const notes=[t(key)];if(latest&&Number.isFinite(age)&&age>36)notes.push(t('stale'));if(DATA.diagnostics.length)notes.push(t('diagnostics'));
    $('coverage-note').textContent=notes.join(' ');$('coverage-note').className='notice'+(['unavailable','retained'].includes(key)?' error':key==='partial'||age>36?' warn':'');
  }
  function renderStats(day){
    const cards=cardsOf(day),negative=cards.filter(card=>['high','medium'].includes(card.risk)).length,status=deltaStatus(day),counts=changeCounts(day,status);
    const values=[[cards.length,'unique'],[negative,'negativeCount'],[status.active?counts.new+counts.changed:'—','changesCount'],[sourcesOfRun().length,'sources']];
    $('stats').replaceChildren(...values.map(([value,key])=>{const n=el('div','stat');n.append(el('b','',String(value)),el('span','',countLabel(value,key)));return n;}));
  }
  function validDate(value){
    if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return '';
    try{return new Date(value+'T00:00:00Z').toISOString().slice(0,10)===value?value:'';}catch{return '';}
  }
  function dateKeys(values,limit){return [...new Set((Array.isArray(values)?values:[]).map(validDate).filter(value=>value&&(!limit||value<=limit)))].sort();}
  function historyOf(card,day){
    const history=card.history;
    if(!history||history.scope!=='recorded_dates')return null;
    const dates=dateKeys(history.observed_dates,day?.report_date);
    if(!dates.length)return null;
    let consecutive=1;
    for(let index=dates.length-1;index>0;index--){if(Date.parse(dates[index]+'T00:00:00Z')-Date.parse(dates[index-1]+'T00:00:00Z')!==86400000)break;consecutive++;}
    const first=validDate(history.first_recorded_date),last=validDate(history.last_recorded_date);
    return {dates,observed:dates.length,consecutive,first:first&&first<=dates[0]?first:'',last:last===dates[dates.length-1]?last:dates[dates.length-1],
      changes:dateKeys(history.change_dates,day?.report_date),events:(Array.isArray(history.change_events)?history.change_events:[]).filter(event=>event&&typeof event==='object'&&validDate(event.date)&&event.date<=day.report_date)};
  }
  function appendOriginals(content,card){
    const sources=originalSources(card);if(sources.length<2)return;
    const details=el('details','item-details'),summary=el('summary','',`${t('sourceOriginals')} (${sources.length})`),list=el('ul','source-links');
    sources.forEach(source=>{
      const row=el('li'),href=safeLink(source.url),title=el(href?'a':'span','',text(source.title)||text(card.title));
      if(href){title.href=href;title.target='_blank';title.rel='noopener noreferrer';}
      row.append(el('span','meta',(text(source.source)||t('source'))+' · '+time(source.published_at||source.observed_at)),title);list.append(row);
    });
    details.append(summary,list);content.append(details);
  }
  function appendHistory(content,meta,card,day){
    const history=historyOf(card,day);
    if(!history){meta.append(el('span','',t('historyUnknown')));return;}
    if(history.consecutive>=2)meta.append(el('span','history-badge',t('consecutive').replace('{n}',history.consecutive)));
    else if(history.observed>=2)meta.append(el('span','history-badge',t('cumulative').replace('{n}',history.observed)));
    const details=el('details','item-details'),summary=el('summary','',t('historyRecords')),body=el('div','recorded-history');
    body.append(el('p','',`${t('firstRecorded')}: ${history.first||t('unknown')}`),el('p','',`${t('lastRecorded')}: ${history.last||t('unknown')}`),el('p','',`${t('observedDates')}: ${history.dates.join(' · ')}`),el('p','',history.changes.length?`${t('changeDates')}: ${history.changes.join(' · ')}`:t('noRecordedChanges')));
    if(history.events.length){const list=el('ul','history-events');history.events.forEach(event=>{list.append(el('li','',`${time(event.generated_at||event.date+'T00:00:00Z')} · ${text(event.title)}`));});body.append(el('p','',t('changeRecords')),list);}
    body.append(el('p','',t('historyScope')));details.append(summary,body);content.append(details);
  }
  function itemNode(card,status,day){
    const row=el('article','item');row.append(el('span','dot '+(['high','medium','positive','neutral'].includes(card.risk)?card.risk:'neutral')));
    const content=el('div'),href=safeLink(card.url),title=el(href?'a':'p','item-title',text(card.title));
    if(href){title.href=href;title.target='_blank';title.rel='noopener noreferrer';}content.append(title);
    const change=cardChange(card,status);if(['new','changed'].includes(change))content.append(el('span','change-flag '+change,t(change)));
    const meta=el('div','meta'),names=sourceNamesOf(card);meta.append(el('span','',names.length?names.join(' · '):t('source')),el('span','',sectionsOf(card).map(t).join(' / ')),el('span','',t(card.risk||'neutral')));
    meta.append(el('span','',`${t(card.published_at?'published':'observed')}: ${time(card.published_at||card.observed_at)}`));
    if(Array.isArray(card.risk_terms)&&card.risk_terms.length)meta.append(el('span','terms',`${t('keywords')}: ${card.risk_terms.map(text).filter(Boolean).join(' · ')}`));
    content.append(meta);appendOriginals(content,card);appendHistory(content,meta,card,day);row.append(content);return row;
  }
  function searchable(card){return [card.title,...sourceNamesOf(card),...(Array.isArray(card.risk_terms)?card.risk_terms:[]),...originalSources(card).flatMap(source=>[source.title,source.source])].map(text).join(' ').toLocaleLowerCase();}
  function renderBoard(){
    const day=current(),cards=cardsOf(day),status=renderDelta(day);renderStats(day);
    const candidates=state.view==='changes'&&status.active?cards.filter(card=>['new','changed'].includes(cardChange(card,status))):cards;
    const negative=card=>['high','medium'].includes(card.risk);
    const visible=candidates.filter(card=>(state.risk==='all'||card.risk===state.risk)&&(state.source==='all'||sourceNamesOf(card).includes(state.source))&&(!state.query||searchable(card).includes(state.query))&&(state.section==='all'||(state.section==='alerts'?negative(card):sectionsOf(card).includes(state.section))));
    $('result-count').textContent=`${visible.length} ${countLabel(visible.length,'unique')}`;
    const board=$('board');board.replaceChildren();
    if(!day){board.append(el('div','section empty',t('noData')));return;}
    if(!visible.length){
      const filteredOut=state.query||state.risk!=='all'||state.source!=='all';
      const incomplete=day.coverage.state!=='complete'||DATA.last_run?.coverage?.state==='unavailable';
      const key=filteredOut?'noMatch':state.view==='changes'&&status.active?(state.section==='all'?'noChangesOverall':'noChanges'):state.section==='alerts'?(incomplete?'uncertainAlerts':'noAlerts'):state.section==='all'?'noItemsOverall':'noItems';
      const empty=el('div','section empty',state.section==='all'?t(key):`${t(state.section)}: ${t(key)}`);
      if(state.view==='changes')empty.append(showAllButton());board.append(empty);return;
    }
    const section=el('section','section'),heading=el('h2');heading.append(el('span','',t(state.section==='all'?'allCards':state.section)),el('span','',`${visible.length} ${countLabel(visible.length,'entries')}`));section.append(heading);
    const priority={high:0,medium:1,neutral:2,positive:3};visible.sort((a,b)=>(priority[a.risk]??2)-(priority[b.risk]??2));visible.forEach(card=>section.append(itemNode(card,status,day)));board.append(section);
  }
  function renderChrome(){
    document.documentElement.lang=language;document.title=t('title');document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=t(node.dataset.i18n));
    const delta=deltaStatus(current());options($('view'),[['changes',t('changes')],['all',t('full')]],state.view);$('view').children[0].disabled=!delta.active;$('view').setAttribute('aria-label',t('view'));
    $('language').value=language;$('language').setAttribute('aria-label',t('language'));$('theme').setAttribute('aria-label',t('theme'));$('date').setAttribute('aria-label',t('date'));$('search').placeholder=t('search');$('risk').setAttribute('aria-label',t('allRisks'));$('source').setAttribute('aria-label',t('source'));$('tabs').setAttribute('aria-label',t('all'));
    options($('date'),DATA.days.length?DATA.days.map(day=>[day.report_date,day.report_date+(day.report_date!==DATA.calendar_date?' · '+t('historical'):'')]):[['',t('noData')]],state.date);
    options($('risk'),[['all',t('allRisks')],...['high','medium','positive','neutral'].map(key=>[key,t(key)])],state.risk);
    const names=[...new Set(cardsOf(current()).flatMap(sourceNamesOf))].sort();if(state.source!=='all'&&!names.includes(state.source))state.source='all';options($('source'),[['all',t('allSources')],...names.map(name=>[name,name])],state.source);
    options($('theme'),window.WorkhubEmbeddedTheme.themes.map(key=>[key,t(key)]),activeTheme());
    $('tabs').replaceChildren(...['all','alerts',...sectionKeys].map(key=>{const button=el('button','',t(key));button.type='button';button.setAttribute('aria-pressed',String(state.section===key));button.addEventListener('click',()=>{state.section=key;renderChrome();renderBoard();});return button;}));
    const day=current();$('generated').textContent=`${t('generated')}: ${time(day?.generated_at)}`;$('build-note').textContent=`${t('built')}: ${time(DATA.generated_at)}`;
    $('demo-note').hidden=!(DATA.is_demo||day?.is_demo||DATA.last_run?.is_demo);$('demo-note').textContent=t('demo');renderHealth();
  }
  function applyLanguage(value,persist=true){if(!['zh-CN','en'].includes(value))return;language=value;if(persist){try{localStorage.setItem(languageKey,value);}catch{}}renderChrome();renderBoard();}
  const allowedParents=new Set(['http://127.0.0.1:8787']);const configured=document.documentElement.getAttribute('data-workhub-parent-origin');
  if(configured){try{const u=new URL(configured);if(['http:','https:'].includes(u.protocol)&&['127.0.0.1','localhost','[::1]','::1'].includes(u.hostname)&&!u.username&&!u.password&&!u.search&&!u.hash&&u.pathname==='/'&&(u.origin===configured||u.origin+'/'===configured))allowedParents.add(u.origin);}catch{}}
  window.addEventListener('message',event=>{if(window.parent===window||event.source!==window.parent||!allowedParents.has(event.origin)||!event.data||typeof event.data!=='object')return;if(event.data.type==='workhub:language')applyLanguage(event.data.language);if(event.data.type==='workhub:theme')options($('theme'),window.WorkhubEmbeddedTheme.themes.map(k=>[k,t(k)]),activeTheme());});
  function requestLanguage(){if(window.parent!==window)for(const origin of allowedParents)window.parent.postMessage({type:'workhub:language-request'},origin);}
  window.addEventListener('pageshow',requestLanguage);window.addEventListener('storage',event=>{if(event.key===languageKey)applyLanguage(event.newValue||'zh-CN',false);if(event.key==='workhub-theme'||event.key===null)options($('theme'),window.WorkhubEmbeddedTheme.themes.map(k=>[k,t(k)]),activeTheme());});
  $('language').addEventListener('change',()=>applyLanguage($('language').value));
  $('theme').addEventListener('change',()=>{const fixedLight=document.documentElement.dataset.workhubReadingTheme==='light';const value=fixedLight?'codex-light':$('theme').value;if(!window.WorkhubEmbeddedTheme.themes.includes(value))return;document.documentElement.setAttribute('data-workhub-theme',value);$('theme').value=value;if(!fixedLight){try{localStorage.setItem('workhub-theme',value);}catch{}}});
  $('date').addEventListener('change',()=>{state.date=$('date').value;state.source='all';chooseDateView();renderChrome();renderBoard();});
  $('view').addEventListener('change',()=>selectView($('view').value));
  $('search').addEventListener('input',()=>{state.query=$('search').value.trim().toLocaleLowerCase();renderBoard();});
  $('risk').addEventListener('change',()=>{state.risk=$('risk').value;renderBoard();});$('source').addEventListener('change',()=>{state.source=$('source').value;renderBoard();});
  chooseDateView();applyLanguage(language,false);requestLanguage();
})();
