rder);border-radius:7px;min-width:0;overflow-wrap:anywhere}.source-card .card-head{margin-bottom:3px;font-size:13px}.status-error{color:var(--wh-warning)}.glossary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.glossary dt{font-size:13px;font-weight:550}.glossary dd{margin:3px 0 0;font-size:13px;color:var(--wh-muted)}footer{font-size:12px;color:var(--wh-muted);padding-top:12px}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

<script>
(() => {
  'use strict';

  const RESEARCH=JSON.parse(document.getElementById('research-data').textContent);
  const $=id=>document.getElementById(id);
  const strings={
    'zh-CN':{skipContent:'跳到内容',title:'算力产业链研究',chain:'产业链',offers:'GPU 报价',signals:'产业动态',search:'搜索产业、指标、型号或来源',allStages:'全部环节',stage:'产业环节',view:'研究视图',language:'界面语言',theme:'配色',question:'值得追问',source:'原始资料',glossary:'看懂这些词',chainNote:'先看各环节怎样赚钱，再用指标与原始资料检验判断。',offersNote:'目录起价与手工报价分开标注；不是可租订单。对比前请核对 GPU、地区、数量与计费口径。',signalsNote:'重复资料合并来源；未收录不代表没有发生。原文事实与投资判断需要分开核实。',scope:'先核对原始资料，再判断投资方式。租价是观察线索，不能单独证明需求、利润或投资价值。',demo:'虚构演示 · 报价、动态与来源状态仅用于展示，不是市场数据。',noMatch:'没有符合当前筛选的内容。',noOffers:'暂无报价。先采集或导入有来源与时间的报价，再构建页面。',noSignals:'暂无收录动态。请查看来源状态；空结果不代表产业没有变化。',cards:'张研究卡',offersCount:'条报价',signalsCount:'条动态',generated:'数据采集',unknown:'未知',observed:'采集',published:'发布',catalog:'目录起价',manual:'手工报价',quote:'报价',starting:'起',cloud:'云类型',secure:'Secure Cloud',community:'Community Cloud',gpuCount:'GPU 数量',memory:'单卡显存',region:'地区',billing:'计费方式',availability:'可用性',unit:'计价单位',provider:'提供方',on_demand:'按需','on-demand':'按需','GPU-hour':'GPU·小时','server-hour':'整机·小时',spot:'竞价 / 可中断',reserved:'预留',gpu_hour:'GPU·小时',server_hour:'整机·小时',ok:'成功',empty:'无匹配',error:'失败',sourceHealth:'来源状态',checked:'检查',merged:'个来源',noSources:'尚无采集状态。',retained:'本轮来源全部失败，保留上次可用数据；不要把旧报价当成当前行情。',partial:'部分来源失败，当前资料不完整。',failed:'最近采集全部失败，尚无可用资料。',stale:'数据已超过 36 小时，请重新核实。',unknownTime:'采集时间未知，报价时效无法核实。',oldData:'保留的旧数据',cardsSingular:'张研究卡',offersCountSingular:'条报价',signalsCountSingular:'条动态','codex-light':'Codex 明亮','codex-dark':'Codex 深色',moss:'苔绿',fog:'雾蓝',graphite:'石墨',sand:'暖沙',orange:'橙白',teal:'青瓷',rose:'玫瑰',indigo:'靛蓝'},
    en:{skipContent:'Skip to content',title:'Compute value-chain research',chain:'Value chain',offers:'GPU quotes',signals:'Updates',search:'Search sectors, metrics, GPUs or sources',allStages:'All stages',stage:'Value-chain stage',view:'Research view',language:'Language',theme:'Colors',question:'Question to test',source:'Original material',glossary:'Terms in plain language',chainNote:'Understand how each stage earns money, then test your view against metrics and original material.',offersNote:'Catalog starting prices and manual quotes are labeled separately, not available orders. Match GPUs, regions, quantities and billing before comparing.',signalsNote:'Duplicate material shares one card with its sources. Missing coverage does not mean nothing happened; verify facts before drawing an investment conclusion.',scope:'Check original material before choosing how to invest. Rental prices alone do not establish demand, profits or investment value.',demo:'Fictional demo · Quotes, updates and source statuses are examples, not market data.',noMatch:'No material matches the current filters.',noOffers:'No quotes yet. Collect or import timestamped, sourced quotes, then rebuild.',noSignals:'No updates collected yet. Check source health; an empty result does not establish an absence of change.',cards:'research cards',offersCount:'quotes',signalsCount:'updates',generated:'Data collected',unknown:'Unknown',observed:'Collected',published:'Published',catalog:'Catalog starting price',manual:'Manual quote',quote:'Quote',starting:'from',cloud:'Cloud type',secure:'Secure Cloud',community:'Community Cloud',gpuCount:'GPU count',memory:'VRAM per GPU',region:'Region',billing:'Billing',availability:'Availability',unit:'Pricing unit',provider:'Provider',on_demand:'On demand','on-demand':'On demand','GPU-hour':'GPU-hour','server-hour':'server-hour',spot:'Spot / interruptible',reserved:'Reserved',gpu_hour:'GPU-hour',server_hour:'server-hour',ok:'Success',empty:'No match',error:'Failed',sourceHealth:'Source health',checked:'Checked',merged:'sources',noSources:'No collection status yet.',retained:'Every source failed in the latest run. Previous data is retained; its quotes are not current market evidence.',partial:'Some sources failed. The available material is incomplete.',failed:'All sources failed and no usable material is available.',stale:'Data is more than 36 hours old; verify it again.',unknownTime:'The collection time is unknown; quote freshness cannot be verified.',oldData:'Retained older data',cardsSingular:'research card',offersCountSingular:'quote',signalsCountSingular:'update','codex-light':'Codex Light','codex-dark':'Codex Dark',moss:'Moss',fog:'Mist blue',graphite:'Graphite',sand:'Warm sand',orange:'Orange',teal:'Celadon',rose:'Rose',indigo:'Indigo'}
  };
  const t=key=>strings[language][key]||key;
  const localized=value=>typeof value==='string'?value:value?.[language]||value?.['zh-CN']||value?.en||'';
  const make=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=String(text);return n;};
  const safeURL=value=>{try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch{return '';}};
  const stamp=value=>{if(!value)return t('unknown');const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleString(language==='en'?'en-GB':'zh-CN',{dateStyle:'medium',timeStyle:'short'}):t('unknown');};
  const str=value=>typeof value==='string'||typeof value==='number'?String(value):'';
  const shown=value=>value===null||value===undefined||value===''||value==='unknown'?t('unknown'):str(value);
  const stages=Array.isArray(RESEARCH.stages)?RESEARCH.stages:[], items=Array.isArray(DATA.items)?DATA.items:[];
  const stageName=id=>localized(stages.find(s=>s.id===id)?.name)||id||t('unknown');
  const languageKey='workhub-language',stateKey='workhub-compute-search-state-v1';let language='zh-CN';
  let state={view:'chain',stage:'all',query:''};
  try{const lang=localStorage.getItem(languageKey);if(['zh-CN','en'].includes(lang))language=lang;const saved=JSON.parse(localStorage.getItem(stateKey)||'null');if(saved&&typeof saved==='object'){if(['chain','offers','signals'].includes(saved.view))state.view=saved.view;if(saved.stage==='all'||stages.some(s=>s.id===saved.stage))state.stage=saved.stage;if(typeof saved.query==='string')state.query=saved.query.slice(0,1000);}}catch{}
  const save=()=>{try{localStorage.setItem(stateKey,JSON.stringify(state));}catch{}};
  const matches=values=>!state.query.trim()||values.join(' ').toLocaleLowerCase().includes(state.query.trim().toLocaleLowerCase());
  function linkNode(value,label){const href=safeURL(value),n=make(href?'a':'span','',label);if(href){n.href=href;n.target='_blank';n.rel='noopener noreferrer';}return n;}
  function options(node,values,selected){node.replaceChildren(...values.map(([value,label])=>{const n=make('option','',label);n.value=value;n.selected=value===selected;return n;}));}
  function currentTheme(){return document.documentElement.getAttribute('data-workhub-theme')||window.WorkhubEmbeddedTheme.getTheme();}
  function researchCard(s,index){
    const card=make('article','card research-card'),head=make('div','card-head');head.append(make('h2','',localized(s.name)),make('span','index',String(index+1).padStart(2,'0')));card.append(head,make('p','business',localized(s.business)));
    const tags=make('div','tags');(s.indicators||[]).forEach(v=>tags.append(make('span','tag',localized(v))));card.append(tags);
    const q=make('p','question');q.append(make('b','',t('question')),make('span','',localized(s.question)));card.append(q);
    const links=make('div','links');(s.links||[]).forEach(v=>links.append(linkNode(v.url,localized(v.name)+' ↗')));card.append(links);return card;
  }
  function spec(list,key,value){list.append(make('dt','',t(key)),make('dd','',shown(value)));}
  function quoteCard(item){
    const q=item.quote||{},card=make('article','card quote-card'),head=make('div','card-head');head.append(make('h2','',q.gpu||item.title||t('unknown')),make('span','pill',q.cloud==='secure'?t('secure'):q.cloud==='community'?t('community'):shown(q.cloud)));card.append(head);
    const catalog=['catalog_from','catalog_starting'].includes(q.price_basis)||item.provenance==='official_catalog',basis=catalog?'catalog':q.price_basis==='manual'||item.provenance==='manual'?'manual':'quote';card.append(make('div','quote-basis',`${item.provider||t('unknown')} · ${t(basis)}`));
    const price=make('p','price'),valid=typeof q.price==='number'&&Number.isFinite(q.price)&&q.price>=0;
    const unit=t(q.unit||'unknown');price.append(document.createTextNode(valid?`${str(q.currency)||t('unknown')} ${q.price.toLocaleString(language==='en'?'en-US':'zh-CN',{maximumFractionDigits:5})}`:t('unknown')),make('small','',valid?` / ${unit}${catalog?' · '+t('starting'):''}`:''));card.append(price);
    const specs=make('dl','specs');spec(specs,'gpuCount',q.gpu_count);spec(specs,'memory',q.vram_gb==null?t('unknown'):`${shown(q.vram_gb)} GB`);spec(specs,'region',q.region);spec(specs,'billing',q.billing?t(q.billing):t('unknown'));spec(specs,'availability',q.availability?t(q.availability):t('unknown'));card.append(specs);
    const footer=make('div','stamp');footer.append(make('span','',`${t('observed')}: ${stamp(item.observed_at)}${item.stale?' · '+t('oldData'):''}`));const links=make('div','links');links.append(linkNode(item.url,t('source')+' ↗'));footer.append(links);card.append(footer);return card;
  }
  function signalCard(item){
    const card=make('article','card signal'),h=make('h2');h.append(linkNode(item.url,item.title||t('unknown')));card.append(h,make('span','pill',stageName(item.stage)));
    const meta=make('div','meta');meta.textContent=`${item.provider||t('unknown')} · ${t(item.published_at?'published':'observed')}: ${stamp(item.published_at||item.observed_at)}${item.stale?' · '+t('oldData'):''}`;card.append(meta);if(item.summary)card.append(make('p','',item.summary));
    const refs=Array.isArray(item.sources)?item.sources:[];if(refs.length>1){const details=make('details'),summary=make('summary','',`${refs.length} ${t('merged')}`),links=make('div','links');refs.forEach(s=>links.append(linkNode(s.url,s.name||t('source'))));details.append(summary,links);card.append(details);}return card;
  }
  function renderBoard(){
    const board=$('board');board.className=state.view==='signals'?'signals':'grid';board.replaceChildren();
    let pool=[];
    if(state.view==='chain')pool=stages.filter(s=>(state.stage==='all'||s.id===state.stage)&&matches([localized(s.name),localized(s.business),localized(s.question),...(s.indicators||[]).map(localized),...(s.links||[]).map(l=>localized(l.name)),s.id]));
    else pool=items.filter(i=>(state.view==='offers'?i.kind==='offer':['signal','filing'].includes(i.kind))&&(state.stage==='all'||i.stage===state.stage)&&matches([i.title,i.summary,i.provider,stageName(i.stage),JSON.stringify(i.quote||{}),...(i.sources||[]).map(s=>s.name)]));
    const key=state.view==='chain'?'cards':state.view==='offers'?'offersCount':'signalsCount';$('result-count').textContent=`${pool.length} ${t(language==='en'&&pool.length===1?key+'Singular':key)}`;
    $('view-note').textContent=t(state.view==='chain'?'chainNote':state.view==='offers'?'offersNote':'signalsNote');
    if(!pool.length){board.append(make('div','empty',t(state.query||state.stage!=='all'?'noMatch':state.view==='offers'?'noOffers':state.view==='signals'?'noSignals':'noMatch')));return;}
    pool.forEach(i=>board.append(state.view==='chain'?researchCard(i,stages.indexOf(i)):state.view==='offers'?quoteCard(i):signalCard(i)));
  }
  function sourceDetail(value){
    const detail=str(value),accepted=/^accepted_items:(\d+)$/.exec(detail),http=/^http_status_(\d{3})$/.exec(detail);
    if(accepted){const count=Number(accepted[1]);return language==='en'?`Accepted ${count} ${count===1?'item':'items'}`:`收录 ${count} 条`;}
    if(http)return language==='en'?`The endpoint returned HTTP ${http[1]}`:`接口返回 HTTP ${http[1]}`;
    const labels={network_failure:['连接失败','Connection failed'],invalid_source_payload:['资料格式无法识别','Unrecognized data format'],response_too_large:['返回资料过大','Response exceeded the size limit'],source_deadline:['来源响应超时','Source timed out'],'fictional examples; not market observations':['虚构示例，非市场数据','Fictional examples, not market data']};
    return labels[detail]?.[language==='en'?1:0]||detail;
  }
  function renderHealth(){
    const run=DATA.last_run||raw.last_run||DATA,sources=Array.isArray(run.sources)?run.sources:[],counts={ok:0,empty:0,error:0};sources.forEach(s=>{if(s.status in counts)counts[s.status]++;});
    $('source-summary').textContent=`${t('sourceHealth')} · ${['ok','empty','error'].map(k=>`${t(k)} ${counts[k]}`).join(' / ')}`;
    $('source-list').replaceChildren(...sources.map(s=>{const card=make('div','source-card'),head=make('div','card-head');head.append(linkNode(s.url,s.name||s.id||t('unknown')),make('span',s.status==='error'?'status-error':'meta',t(s.status||'unknown')));card.append(head,make('p','meta',`${t('checked')}: ${stamp(s.checked_at)}`));if(s.detail)card.append(make('p','meta',sourceDetail(s.detail)));return card;}));
    if(!sources.length)$('source-list').append(make('p','meta',t('noSources')));
    const notes=[];if(DATA.mode!=='demo'){if(sources.length&&counts.error===sources.length)notes.push(t(items.length?'retained':'failed'));else if(counts.error)notes.push(t('partial'));const age=(Date.now()-Date.parse(DATA.generated_at))/3600000;if(Number.isFinite(age)&&age>36)notes.push(t('stale'));else if(!Number.isFinite(age))notes.push(t('unknownTime'));}
    $('health-note').hidden=!notes.length;$('health-note').textContent=notes.join(' ');
  }
  function renderChrome(){
    document.documentElement.lang=language;document.title=t('title');document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));
    $('views').setAttribute('aria-label',t('view'));$('views').replaceChildren(...['chain','offers','signals'].map(v=>{const b=make('button','',t(v));b.type='button';b.setAttribute('aria-pressed',String(state.view===v));b.addEventListener('click',()=>{state.view=v;save();renderChrome();renderBoard();});return b;}));
    options($('stage'),[['all',t('allStages')],...stages.map(s=>[s.id,localized(s.name)])],state.stage);$('stage').setAttribute('aria-label',t('stage'));$('search').placeholder=t('search');$('search').value=state.query;$('search').setAttribute('aria-label',t('search'));
    $('language').value=language;$('language').setAttribute('aria-label',t('language'));$('theme').setAttribute('aria-label',t('theme'));options($('theme'),window.WorkhubEmbeddedTheme.themes.map(v=>[v,t(v)]),currentTheme());
    $('generated').textContent=`${t('generated')}: ${stamp(DATA.generated_at)}`;$('demo-note').hidden=DATA.mode!=='demo';$('demo-note').textContent=t('demo');
    $('glossary').replaceChildren(...(RESEARCH.glossary||[]).map(g=>{const div=make('div');div.append(make('dt','',g.term),make('dd','',localized(g)));return div;}));renderHealth();
  }
  function applyLanguage(value,persist=true){if(!['zh-CN','en'].includes(value))return;language=value;if(persist){try{localStorage.setItem(languageKey,value);}catch{}}renderChrome();renderBoard();}
  const allowedParents=new Set(['http://127.0.0.1:8787']),configured=document.documentElement.getAttribute('data-workhub-parent-origin');
  if(configured){try{const u=new URL(configured);if(['http:','https:'].includes(u.protocol)&&['127.0.0.1','localhost','[::1]','::1'].includes(u.hostname)&&!u.username&&!u.password&&!u.search&&!u.hash&&u.pathname==='/'&&(u.origin===configured||u.origin+'/'===configured))allowedParents.add(u.origin);}catch{}}
  function requestLanguage(){if(window.parent!==window)for(const origin of allowedParents)window.parent.postMessage({type:'workhub:language-request'},origin);}
  window.addEventListener('message',event=>{if(window.parent===window||event.source!==window.parent||!allowedParents.has(event.origin)||!event.data||typeof event.data!=='object')return;if(event.data.type==='workhub:language')applyLanguage(event.data.language);if(event.data.type==='workhub:theme')options($('theme'),window.WorkhubEmbeddedTheme.themes.map(v=>[v,t(v)]),currentTheme());});
  window.addEventListener('pageshow',requestLanguage);window.addEventListener('storage',event=>{if(event.key===languageKey)applyLanguage(event.newValue||'zh-CN',false);if(event.key==='workhub-theme'||event.key===null)options($('theme'),window.WorkhubEmbeddedTheme.themes.map(v=>[v,t(v)]),currentTheme());});
  $('language').addEventListener('change',()=>applyLanguage($('language').value));$('stage').addEventListener('change',()=>{state.stage=$('stage').value;save();renderBoard();});$('search').addEventListener('input',()=>{state.query=$('search').value;save();renderBoard();});
  $('theme').addEventListener('change',()=>{const value=$('theme').value;if(!window.WorkhubEmbeddedTheme.themes.includes(value))return;document.documentElement.setAttribute('data-workhub-theme',value);try{localStorage.setItem('workhub-theme',value);}catch{}});
  applyLanguage(language,false);requestLanguage();
})();
</script>
