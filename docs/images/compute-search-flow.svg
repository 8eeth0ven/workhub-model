<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1040" viewBox="0 0 750 1040" role="img" aria-labelledby="title desc"><title id="title">算力投资研究的三个步骤</title><desc id="desc">看懂生意、核对同口径数据、寻找反例；目录价格不等于设备收益。原创示意，非截图。</desc><rect width="750" height="1040" fill="#f7f7f8"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="52" y="64" font-size="17" fill="#71717a" letter-spacing="1.3">WORKHUB / COMPUTE RESEARCH</text><text x="52" y="119" font-size="36" font-weight="700" fill="#18181b">先把问题问清楚</text><text x="52" y="161" font-size="21" fill="#62626b">七类研究卡，让资料和判断之间多一步核对。</text><path d="M90 282V827" stroke="#ceced4" stroke-width="2"/><g fill="#fff" stroke="#dedee3"><rect x="52" y="205" width="646" height="198" rx="17"/><rect x="52" y="445" width="646" height="198" rx="17"/><rect x="52" y="685" width="646" height="198" rx="17"/></g><g fill="#303038"><circle cx="91" cy="248" r="21"/><circle cx="91" cy="488" r="21"/><circle cx="91" cy="728" r="21"/></g><g fill="#fff" font-size="20" text-anchor="middle"><text x="91" y="255">1</text><text x="91" y="495">2</text><text x="91" y="735">3</text></g><g fill="#18181b" font-size="29" font-weight="600"><text x="127" y="259">看懂生意</text><text x="127" y="499">核对数据</text><text x="127" y="739">寻找反例</text></g><g fill="#52525b" font-size="24"><text x="86" y="320">谁付钱？谁承担设备和电力成本？</text><text x="86" y="359">从芯片到需求方，分开看收入与现金流。</text><text x="86" y="560">同型号，也要分地区、云类型和计费。</text><text x="86" y="599">保留来源与时间，重复卡片合并展示。</text><text x="86" y="800">如果利用率下滑，原来的判断还成立吗？</text><text x="86" y="839">列出未知，再决定下一步验证什么。</text></g><rect x="52" y="924" width="646" height="58" rx="11" fill="#eaeaec"/><text x="375" y="961" text-anchor="middle" font-size="21" fill="#52525b">目录起价 ≠ 出租收益　·　资料入口 ≠ 推荐标的</text><text x="52" y="1016" font-size="15" fill="#71717a">原创功能示意 · 非真实界面截图</text></g></svg>
