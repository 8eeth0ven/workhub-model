<g fill="#4a4b50" font-size="17" font-weight="600" text-anchor="middle"><text x="85" y="230">01</text><text x="85" y="419">02</text><text x="85" y="608">03</text><text x="85" y="817">04</text></g>
<g fill="#202123" font-size="28" font-weight="600"><text x="122" y="233">选择模块，独立安装</text><text x="122" y="422">按自己的网络配置采集</text><text x="122" y="611">先检查来源有没有掉线</text><text x="122" y="820">生成简报，接进工作台</text></g>
<g fill="#62646b" font-size="22"><text x="122" y="278">安装只复制文件，不会自动运行</text><text x="122" y="467">公开新闻与汽车热搜，失败分别记录</text><text x="122" y="656">失败、为空、旧数据，分别说明</text><text x="122" y="697">关键词只是线索，事实还要看原文</text><text x="122" y="865">负面线索在前，原网页正文保留空间</text><text x="122" y="902" font-size="19">每日运行需由你显式设置，不随安装开启</text></g>
