<g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif">
<text x="44" y="48" font-size="17" letter-spacing="1.4" font-weight="600" fill="#4a4b50">WORKHUB MODEL · 车圈舆情</text>
<text x="44" y="108" font-size="34" font-weight="700" fill="#202123">下载一个模块，多一个可用功能</text><text x="44" y="145" font-size="22" fill="#62646b">源码、提示词与看板，一起带走</text>
<g fill="#fff" stroke="#dedee1"><rect x="44" y="183" width="662" height="148" rx="18"/><rect x="44" y="372" width="662" height="148" rx="18"/><rect x="44" y="561" width="662" height="168" rx="18"/><rect x="44" y="770" width="662" height="158" rx="18"/></g>
