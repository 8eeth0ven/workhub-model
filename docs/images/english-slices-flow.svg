<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc"><title id="title">一片一片，看过去</title><desc id="desc">英语学习模块的原创功能图：按片浏览，随时点播，导入自己的材料并保存在本机。非真实界面截图。</desc><rect width="900" height="660" fill="#f7f7f8"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="48" y="46" font-size="16" fill="#71717a" letter-spacing="1.5">WORKHUB / ENGLISH IN SLICES</text><text x="48" y="109" font-size="43" font-weight="700" fill="#18181b">一片一片，看过去</text><g fill="#fff" stroke="#dedee3"><rect x="48" y="154" width="392" height="222" rx="16"/><rect x="460" y="154" width="392" height="222" rx="16"/><rect x="48" y="401" width="804" height="190" rx="16"/></g><g fill="#303038"><circle cx="86" cy="197" r="20"/><circle cx="498" cy="197" r="20"/><circle cx="86" cy="444" r="20"/></g><g fill="#fff" font-size="20" text-anchor="middle"><text x="86" y="204">1</text><text x="498" y="204">2</text><text x="86" y="451">3</text></g><g fill="#18181b" font-weight="600"><text x="120" y="209" font-size="34">按片浏览</text><text x="532" y="209" font-size="34">随时点播</text><text x="120" y="456" font-size="33">自己的材料，留在本机</text><text x="80" y="288" font-size="45">8 / 16 / 32</text><text x="490" y="286" font-size="34">词 · 句 · 整片</text></g><g fill="#62626b"><text x="80" y="340" font-size="27">连续滑动，词句一起看</text><text x="490" y="340" font-size="27">暂停 / 继续 / 停止</text><text x="83" y="513" font-size="28">CSV · TSV · JSON · TXT</text><text x="83" y="558" font-size="28">本机保存，可导出备份</text></g><path d="M721 498V544H768V498M712 498H777M744 475V521M732 509L744 521 756 509" stroke="#73737d" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="634" font-size="18" fill="#71717a">原创示意 · 非界面截图 · 播放不会自动标记学会</text></g></svg>
