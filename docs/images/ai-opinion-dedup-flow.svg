<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><rect width="900" height="660" fill="#ffffff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Helvetica Neue,Arial,sans-serif" fill="#18181b"><text x="50" y="65" font-size="36" font-weight="620" fill="#18181b" >合在一起看，按记录追踪</text><text x="51" y="106" font-size="23" font-weight="400" fill="#71717a" >保留原题和出处，也保留日期的边界</text><rect x="50" y="146" width="228" height="60" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="70" y="185" font-size="26" font-weight="500" fill="#18181b" >来源 A</text><path d="M184 176 L253 176" fill="none" stroke="#d4d4d8" stroke-width="3" /><rect x="50" y="221" width="228" height="60" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="70" y="260" font-size="26" font-weight="500" fill="#18181b" >来源 B</text><path d="M184 251 L253 251" fill="none" stroke="#d4d4d8" stroke-width="3" /><rect x="50" y="296" width="228" height="60" rx="10" fill="#fafafa" stroke="#e4e4e7"/><text x="70" y="335" font-size="26" font-weight="500" fill="#18181b" >来源 C</text><path d="M184 326 L253 326" fill="none" stroke="#d4d4d8" stroke-width="3" /><path d="M278 176 L310 176" fill="none" stroke="#d4d4d8" stroke-width="2" /><path d="M278 251 L328 251" fill="none" stroke="#d4d4d8" stroke-width="2" /><path d="M278 326 L310 326" fill="none" stroke="#d4d4d8" stroke-width="2" /><path d="M310 176 L310 326" fill="none" stroke="#d4d4d8" stroke-width="2" /><path d="M310 251 L355 251" fill="none" stroke="#a1a1aa" stroke-width="2" /><path d="M348 244 L355 251 L348 258" fill="none" stroke="#a1a1aa" stroke-width="2"/><rect x="374" y="146" width="476" height="210" rx="14" fill="#ffffff" stroke="#a1a1aa"/><text x="398" y="189" font-size="30" font-weight="600" fill="#18181b" >同题动态</text><rect x="694" y="161" width="133" height="36" rx="7" fill="#f4f4f5" stroke="#e4e4e7"/><text x="709" y="187" font-size="22" font-weight="400" fill="#52525b" >3 个来源</text><path d="M398 210 L827 210" fill="none" stroke="#d4d4d8" stroke-width="2" /><text x="398" y="250" font-size="24" font-weight="400" fill="#52525b" >原始标题 · 来源 A  ↗</text><text x="398" y="288" font-size="24" font-weight="400" fill="#52525b" >原始标题 · 来源 B  ↗</text><text x="398" y="326" font-size="24" font-weight="400" fill="#52525b" >原始标题 · 来源 C  ↗</text><rect x="50" y="390" width="800" height="206" rx="14" fill="#fafafa" stroke="#e4e4e7"/><text x="73" y="433" font-size="28" font-weight="600" fill="#18181b" >跨日记录</text><text x="566" y="432" font-size="28" font-weight="600" fill="#18181b" >累计出现 2 天</text><path d="M113 480 L758 480" fill="none" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="6 7"/><circle cx="147" cy="480" r="9" fill="#27272a" stroke="#27272a" stroke-width="2"/><text x="147" y="519" font-size="23" font-weight="500" fill="#52525b" text-anchor="middle">第 1 日</text><circle cx="450" cy="480" r="9" fill="#fafafa" stroke="#a1a1aa" stroke-width="2"/><text x="450" y="519" font-size="23" font-weight="500" fill="#52525b" text-anchor="middle">第 2 日</text><circle cx="753" cy="480" r="9" fill="#27272a" stroke="#27272a" stroke-width="2"/><text x="753" y="519" font-size="23" font-weight="500" fill="#52525b" text-anchor="middle">第 3 日</text><text x="450" y="559" font-size="24" font-weight="400" fill="#71717a" text-anchor="middle">中间一天未收录，不能算作连续出现</text><text x="51" y="636" font-size="18" font-weight="400" fill="#71717a" >原创示意 · 虚构条目与日期 · 报道记录不代表事件持续</text></g></svg>