<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><title>从一条属性追到原始依据</title><desc>原创功能结构示意：实体用途和产地经主张连接出处，历史变更继续保留，未知等待核验。</desc><rect width="900" height="660" fill="#f8f9fb"/><g font-family="PingFang SC,Arial,sans-serif"><text x="50" y="65" font-size="38" fill="#171717" font-weight="650">从一条属性，追到原始依据</text><text x="50" y="111" font-size="25" fill="#667085">看做什么 · 查在哪里 · 留下变化</text><g fill="white" stroke="#d9dee6"><rect x="50" y="160" width="230" height="100" rx="10"/><rect x="335" y="160" width="230" height="100" rx="10"/><rect x="620" y="160" width="230" height="100" rx="10"/></g><g text-anchor="middle" font-size="30" fill="#24282f" font-weight="600"><text x="165" y="205">实体与属性</text><text x="450" y="205">关系与主张</text><text x="735" y="205">来源与时间</text></g><g text-anchor="middle" font-size="23" fill="#667085"><text x="165" y="239">用途 / 多种产地</text><text x="450" y="239">方向 / 适用范围</text><text x="735" y="239">披露 / 推断 / 假设</text></g><g fill="none" stroke="#9ba5b5" stroke-width="2.5"><path d="M280 210H325M318 203L325 210L318 217"/><path d="M565 210H610M603 203L610 210L603 217"/></g><g fill="white" stroke="#d9dee6"><rect x="50" y="315" width="385" height="178" rx="10"/><rect x="465" y="315" width="385" height="178" rx="10"/></g><g fill="#24282f" font-size="30" font-weight="600"><text x="76" y="362">过去怎么说？</text><text x="491" y="362">下一步查什么？</text></g><g fill="#667085" font-size="27"><text x="76" y="415">旧主张与新依据并存</text><text x="76" y="460">计划 ≠ 已经交付</text><text x="491" y="415">找独立来源与反例</text><text x="491" y="460">把未知变成核验动作</text></g><rect x="50" y="536" width="800" height="66" rx="9" fill="#e9edf2"/><text x="450" y="578" font-size="29" fill="#475467" text-anchor="middle">资料多，不等于懂生意；每条推断都要回查。</text><text x="50" y="638" font-size="16" fill="#667085">原创功能示意，非截图 · 不代表全行业覆盖或收益判断</text></g></svg>
